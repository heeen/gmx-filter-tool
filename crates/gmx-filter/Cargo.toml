[package]
name = "gmx-filter"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
dirs = "6.0.0"
pest = "2.9.2"
pest_derive = "2.9.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "form", "cookies"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.6"
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }
webauthn-authenticator-rs = { version = "0.6.1-dev", optional = true, features = ["cable", "qrcode", "ui-cli"] }

[dev-dependencies]
mockito = "1.7.2"

[features]
# Log in with a passkey on a phone: QR code + Bluetooth, the "use a phone" (hybrid) flow.
passkey = ["dep:webauthn-authenticator-rs", "dep:tokio"]
