[package]
name = "gmx-filter"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
dirs = "6.0.0"
pest = "2.9.2"
pest_derive = "2.9.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "form", "cookies"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
mockito = "1.7.2"
